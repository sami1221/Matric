<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Matric Exam</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0088cc; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>🎓 የፈተና መግቢያ</h1>
        <div id="menu">
            <button class="btn" onclick="fetchQuestions()">📚 ፈተና ጀምር</button>
            <button class="btn" onclick="showScore()">📊 ውጤቴ</button>
        </div>
        <div id="quiz-area"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchQuestions() {
            // የራስህን የRender/Railway ሊንክ እዚህ አስገባ
            const response = await fetch('https://your-app-name.onrender.com/get_questions');
            const data = await response.json();
            document.getElementById('quiz-area').innerHTML = "ጥያቄዎች ተጭነዋል...";
        }

        function showScore() {
            tg.showPopup({title: 'ውጤት', message: 'አሁናዊ ውጤትዎ፡ 0'});
        }
    </script>
</body>
</html>
