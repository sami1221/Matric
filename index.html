<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Ethiopian Exam App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; background: #f2f2f2; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-top: 10px; }
        button { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 8px; background: #0088cc; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="view-home" class="card">
    <h2>🎓 የፈተና ማዕከል</h2>
    <button onclick="showGrades()">የዓመታት ኢንትራስ እና ሞዴል ፈተና</button>
</div>

<div id="view-grades" class="card" style="display:none;">
    <h3>ክፍል ይምረጡ</h3>
    <button onclick="selectGrade('grade9')">Grade 9</button>
    <button onclick="selectGrade('grade10')">Grade 10</button>
    <button onclick="showStream()">Grade 11 & 12</button>
</div>

<div id="view-stream" class="card" style="display:none;">
    <h3>ዘርፍ ይምረጡ</h3>
    <button onclick="selectStream('natural')">Natural Science</button>
    <button onclick="selectStream('social')">Social Science</button>
</div>

<script>
    function showGrades() {
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-grades').style.display = 'block';
    }

    function showStream() {
        document.getElementById('view-grades').style.display = 'none';
        document.getElementById('view-stream').style.display = 'block';
    }

    function selectStream(stream) {
        // እዚህ ጋር የትምህርት ዝርዝር ወደሚታይበት ገጽ ይወስዳል
        alert(stream + " ትምህርቶች ተከፍተዋል");
    }
</script>
</body>
</html>
