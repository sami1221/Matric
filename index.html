<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matric Exam Prep</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        button { background: #3498db; color: white; border: none; padding: 15px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 የፈተና መግቢያ</h1>
        <p>ወደ ማትሪክ ዝግጅት ቦት እንኳን በደህና መጡ!</p>
        <button onclick="closeApp()">ወደ ቦቱ ተመለስ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function closeApp() { tg.close(); }
    </script>
</body>
</html>
